<!--
  Freeze CSS animations and transitions in the story iframe.

  Pixeleye captures a story as soon as it renders, so anything still animating is
  photographed at an arbitrary frame. An indeterminate `mat-spinner` (the `Loading`
  stories of resource-fetcher, video, audio, advanced-search-results, search-result,
  resources-list, property-row) rotates forever, so every build diffs against its
  own baseline and reports a change that is not one (DEV-7238).

  This cannot be fixed from `pixeleye.config.ts`: `@pixeleye/storybook`'s
  `captureStories` forwards only `name`, `variant`, `selector` and `devices` to the
  snapshot and drops the config-level `css` and `wait`. So the freeze lives here,
  in the head Storybook injects into `iframe.html` — the exact page pixeleye loads.

  Durations are 1ms rather than `none` so animations run to their end state instead
  of snapping back to the base style, and negative delays skip any start offset.
  This also steadies the interaction tests, which no longer race transitions.
-->
<style>
  *,
  *::before,
  *::after {
    animation-delay: -1ms !important;
    animation-duration: 1ms !important;
    animation-iteration-count: 1 !important;
    transition-delay: -1ms !important;
    transition-duration: 1ms !important;
    scroll-behavior: auto !important;
    /* A blinking caret in a focused input is the same problem in miniature. */
    caret-color: transparent !important;
  }
</style>

<!--
  Freeze "today" in the story iframe.

  Components that default to the current date render a different snapshot on every
  day: `app-date-picker` calls `setToday()` when it has no value (its `Empty` and
  `Disabled` stories), `createToday()` feeds the date validators, the footer prints
  the current year. A build on Tuesday then diffs against Monday's baseline.

  Only argument-less `new Date()` / `Date()` are pinned. `Date.now()` stays real on
  purpose: rxjs schedulers (`debounceTime`, `delay`, …) measure elapsed time with it
  and would never fire on a frozen clock. Runs before the app bundle, so every
  component sees the fixed date.
-->
<script>
  (function () {
    var FIXED_NOW = Date.UTC(2024, 5, 15, 12, 0, 0); // 2024-06-15 12:00 UTC
    var RealDate = Date;
    function FrozenDate() {
      if (!(this instanceof FrozenDate)) {
        return new RealDate(FIXED_NOW).toString();
      }
      var args = Array.prototype.slice.call(arguments);
      return args.length ? new (Function.prototype.bind.apply(RealDate, [null].concat(args)))() : new RealDate(FIXED_NOW);
    }
    FrozenDate.prototype = RealDate.prototype;
    FrozenDate.now = RealDate.now;
    FrozenDate.parse = RealDate.parse;
    FrozenDate.UTC = RealDate.UTC;
    window.Date = FrozenDate;
  })();
</script>
