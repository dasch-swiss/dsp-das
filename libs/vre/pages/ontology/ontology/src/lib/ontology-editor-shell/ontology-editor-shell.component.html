<as-split direction="horizontal" [disabled]="(viewService.isPropertyDragging$ | async) ?? false">
  <as-split-area [size]="25">
    <app-ontology-class-navigator data-testid="navigator-pane" />
  </as-split-area>
  <as-split-area [size]="50">
    <app-ontology-class-workspace data-testid="workspace-pane" />
  </as-split-area>
  <as-split-area [size]="25">
    <app-ontology-property-library data-testid="library-pane" />
  </as-split-area>
</as-split>
